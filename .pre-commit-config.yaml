repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        args: [--keep-output]   # outputs stay so GitHub shows every figure; only noisy metadata is removed
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests|scripts)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=10000]
      - id: end-of-file-fixer
        exclude: \.ipynb$
      - id: trailing-whitespace
        exclude: \.ipynb$
  - repo: local
    hooks:
      - id: no-local-paths
        name: no local absolute paths (e.g. /Users/<name>) in published files
        language: pygrep
        entry: '/Users/[A-Za-z]|/home/[a-z]+/'
        exclude: ^\.pre-commit-config\.yaml$
      - id: no-apple-team-id
        name: no Apple developer team id in the Xcode project (each builder sets their own)
        language: pygrep
        entry: 'DEVELOPMENT_TEAM = '
        files: \.pbxproj$
