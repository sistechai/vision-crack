name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VISIONCRACK_DATA: data/sample      # small committed subset; the full data lives on Zenodo
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Notebooks on the sample data
        run: bash scripts/run_all_notebooks.sh 01 02 03 04
